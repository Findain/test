<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PPM Updater Test V2</title><style>body{font:16px system-ui;background:#111827;color:#fff;margin:0}.w{max-width:760px;margin:auto;padding:24px}.c{background:#1f2937;padding:18px;border-radius:14px;margin:14px 0}button{padding:13px;margin:5px;border:0;border-radius:9px;font-weight:700}#register,#apply{background:#f97316;color:#fff}#check,#clear{background:#e5e7eb;color:#111827}pre{background:#030712;padding:14px;min-height:190px;white-space:pre-wrap}.bad{color:#fca5a5}.good{color:#86efac}</style></head><body><main class="w"><h1>PPM updater test V2</h1><section class="c"><b>JavaScript:</b> <span id="js" class="bad">not started</span><br><b>Secure context:</b> <span id="secure">checking</span><br><b>Worker file:</b> <span id="worker">not checked</span><br><b>Waiting worker:</b> <span id="waiting">none</span></section><section class="c"><button type="button" id="register">Register Test Worker</button><button type="button" id="check">Check for Update</button><button type="button" id="apply" disabled>Apply Waiting Update</button><button type="button" id="clear">Clear Test</button></section><section class="c"><pre id="log">Page HTML loaded.
</pre></section></main><script>
(function(){
var log=document.getElementById('log'),reg=null,applying=false,reloaded=false;
function say(x){log.textContent+=new Date().toLocaleTimeString()+'  '+x+'\n';}
function draw(){document.getElementById('waiting').textContent=(reg&&reg.waiting)?reg.waiting.scriptURL:'none';document.getElementById('apply').disabled=!(reg&&reg.waiting);}
document.getElementById('js').textContent='running';document.getElementById('js').className='good';document.getElementById('secure').textContent=window.isSecureContext?'yes':'NO';say('JavaScript started.');
fetch('./service-worker-test.js?probe='+Date.now(),{cache:'no-store'}).then(function(r){document.getElementById('worker').textContent=r.status+' '+r.statusText;say('Worker file probe: '+r.status);}).catch(function(e){document.getElementById('worker').textContent='FAILED';say('WORKER FILE ERROR: '+e.message);});
function bind(r){reg=r;draw();r.addEventListener('updatefound',function(){say('updatefound');var w=r.installing;if(w)w.addEventListener('statechange',function(){say('worker state: '+w.state);draw();});});if(r.waiting)say('Waiting worker ready.');}
document.getElementById('register').addEventListener('click',function(){say('Register button clicked.');if(!('serviceWorker' in navigator)){say('ERROR: Service workers unavailable.');return;}navigator.serviceWorker.register('./service-worker-test.js',{scope:'./',updateViaCache:'none'}).then(function(r){bind(r);say('Registration succeeded. Scope: '+r.scope);return r.update();}).catch(function(e){say('REGISTER ERROR: '+e.name+': '+e.message);});});
document.getElementById('check').addEventListener('click',function(){say('Check button clicked.');var p=reg?Promise.resolve(reg):navigator.serviceWorker.getRegistration('./');p.then(function(r){if(!r)throw new Error('Register first.');if(!reg)bind(r);return r.update();}).then(function(){say('Update check finished.');setTimeout(draw,1000);}).catch(function(e){say('CHECK ERROR: '+e.message);});});
document.getElementById('apply').addEventListener('click',function(){if(!reg||!reg.waiting){say('No waiting worker.');return;}applying=true;reloaded=false;say('Sending SKIP_WAITING.');reg.waiting.postMessage({type:'SKIP_WAITING'});});
navigator.serviceWorker.addEventListener('controllerchange',function(){say('controllerchange fired.');if(applying&&!reloaded){reloaded=true;sessionStorage.setItem('ppmUpdateTestReload','1');setTimeout(function(){location.reload();},300);}});
document.getElementById('clear').addEventListener('click',function(){navigator.serviceWorker.getRegistration('./').then(function(r){return r?r.unregister():false;}).then(function(){say('Test registration cleared.');reg=null;draw();});});
if(sessionStorage.getItem('ppmUpdateTestReload')){sessionStorage.removeItem('ppmUpdateTestReload');say('Single guarded reload completed.');}
})();
</script></body></html>
