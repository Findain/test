<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PPM Updater Test Harness</title>
<style>body{font:16px system-ui;margin:0;background:#101827;color:#f8fafc}.wrap{max-width:760px;margin:auto;padding:24px}.card{background:#1e293b;border:1px solid #475569;border-radius:16px;padding:20px;margin:16px 0}button{padding:12px 16px;margin:6px;border:0;border-radius:10px;font-weight:700;cursor:pointer}.primary{background:#f97316;color:#fff}.secondary{background:#e2e8f0;color:#111827}pre{white-space:pre-wrap;background:#020617;padding:14px;border-radius:10px;min-height:180px}.ok{color:#86efac}.warn{color:#fde68a}</style></head>
<body><main class="wrap"><h1>Paint Project Manager updater test</h1><p>This page is isolated from the production app and uses only <code>service-worker-test.js</code>.</p>
<section class="card"><div><b>Harness:</b> V1</div><div><b>Controller:</b> <span id="controller">checking…</span></div><div><b>Registration:</b> <span id="registration">not started</span></div><div><b>Waiting worker:</b> <span id="waiting">none</span></div></section>
<section class="card"><button id="register" class="primary">1. Register test worker</button><button id="check" class="secondary">2. Check for update</button><button id="apply" class="primary" disabled>3. Apply waiting update</button><button id="clear" class="secondary">Clear test worker</button></section>
<section class="card"><b>Event log</b><pre id="log"></pre></section></main>
<script>
(()=>{const logEl=document.getElementById('log'),apply=document.getElementById('apply');let reg=null,applying=false,reloaded=false;const log=m=>{logEl.textContent+=new Date().toLocaleTimeString()+'  '+m+'
'};const paint=()=>{document.getElementById('controller').textContent=navigator.serviceWorker.controller?.scriptURL||'none';document.getElementById('registration').textContent=reg?'registered':'not registered';document.getElementById('waiting').textContent=reg?.waiting?.scriptURL||'none';apply.disabled=!reg?.waiting};async function bind(r){reg=r;paint();if(r.waiting)log('A waiting worker is ready.');r.addEventListener('updatefound',()=>{const w=r.installing;log('updatefound');w?.addEventListener('statechange',()=>{log('installing state: '+w.state);paint()})})}document.getElementById('register').onclick=async()=>{try{await bind(await navigator.serviceWorker.register('./service-worker-test.js',{scope:'./',updateViaCache:'none'}));log('Worker registered.');await reg.update();paint()}catch(e){log('REGISTER ERROR: '+e.message)}};document.getElementById('check').onclick=async()=>{try{if(!reg)await bind(await navigator.serviceWorker.getRegistration('./'));if(!reg)throw new Error('Register the test worker first.');log('Checking server for a changed worker…');await reg.update();setTimeout(paint,800)}catch(e){log('CHECK ERROR: '+e.message)}};apply.onclick=()=>{if(!reg?.waiting)return;applying=true;reloaded=false;log('Sending SKIP_WAITING to waiting worker.');reg.waiting.postMessage({type:'SKIP_WAITING'})};navigator.serviceWorker.addEventListener('controllerchange',()=>{log('controllerchange fired.');paint();if(applying&&!reloaded){reloaded=true;sessionStorage.setItem('ppm-test-reloaded','1');log('One guarded reload will occur.');setTimeout(()=>location.reload(),300)}});document.getElementById('clear').onclick=async()=>{const r=await navigator.serviceWorker.getRegistration('./');if(r)await r.unregister();for(const k of await caches.keys())if(k.startsWith('ppm-updater-test-'))await caches.delete(k);log('Test worker and test caches cleared.');reg=null;paint()};addEventListener('load',async()=>{if(sessionStorage.getItem('ppm-test-reloaded')){sessionStorage.removeItem('ppm-test-reloaded');log('Reload completed once; guard reset.')}const r=await navigator.serviceWorker.getRegistration('./');if(r)await bind(r);paint()})})();
</script></body></html>
